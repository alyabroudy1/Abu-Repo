name: Build and Deploy

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"
          fetch-depth: 0

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: "builds"
        continue-on-error: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Move built plugins
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/src
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;
          # Copy jars - Assuming full.jar is the one we want. Flatten structure.
          find . -path "*/build/intermediates/full_jar/debug/createFullJarDebug/full.jar" | while read file; do
              # Extract module name from path (e.g. ./ArabSeed/...)
              module=$(echo "$file" | cut -d/ -f2)
              cp "$file" "$GITHUB_WORKSPACE/builds/${module}.jar"
          done

      - name: Generate plugins.json
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew makePluginsJson
          cp plugins.json $GITHUB_WORKSPACE/builds/
          # Run python script to update plugins.json with JAR info
          python3 .github/scripts/update_plugins_json.py $GITHUB_WORKSPACE/builds "https://raw.githubusercontent.com/alyabroudy1/Abu-Repo/builds"

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
