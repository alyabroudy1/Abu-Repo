name: Build and Deploy

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: "build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: "builds"
        continue-on-error: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Move built plugins
        run: |
          mkdir -p $GITHUB_WORKSPACE/builds
          cd $GITHUB_WORKSPACE/src
          find . -name "*.cs3" -exec cp {} $GITHUB_WORKSPACE/builds/ \;

      - name: Generate plugins.json
        run: |
          cd $GITHUB_WORKSPACE/builds
          echo '[' > plugins.json
          first=true
          for file in *.cs3; do
            if [ "$file" != "*.cs3" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo ',' >> plugins.json
              fi
              name="${file%.cs3}"
              echo "{\"name\": \"$name\", \"url\": \"https://raw.githubusercontent.com/${{ github.repository }}/builds/$file\"}" >> plugins.json
            fi
          done
          echo ']' >> plugins.json

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
